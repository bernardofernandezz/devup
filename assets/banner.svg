<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">devup</title>
  <desc id="desc">Um comando configura apps, dotfiles, shell, tema e desktop em qualquer distro Linux.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11121d"/>
      <stop offset="1" stop-color="#1a1b2e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#f7768e"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c0caf5" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", ui-monospace, monospace; }
      .sans { font-family: Inter, "Segoe UI", "DejaVu Sans", system-ui, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- fundo -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="230" cy="170" r="330" fill="url(#glow-a)"/>
  <circle cx="1080" cy="560" r="380" fill="url(#glow-b)"/>

  <!-- marca -->
  <g transform="translate(88 150)">
    <!-- ícone: prompt dentro de um bloco -->
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#brand)"/>
    <path d="M20 24 L34 36 L20 48" fill="none" stroke="#11121d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="38" y="44" width="16" height="6" rx="3" fill="#11121d"/>

    <text x="0" y="168" class="mono" font-size="96" font-weight="700" fill="url(#brand)" letter-spacing="-3">devup</text>
    <text x="2" y="222" class="sans" font-size="28" fill="#c0caf5">Seu Linux inteiro em um comando.</text>
    <text x="2" y="262" class="sans" font-size="20" fill="#7f88b5">Apps, dotfiles, shell, tema e desktop,</text>
    <text x="2" y="290" class="sans" font-size="20" fill="#7f88b5">declarados num arquivo, em qualquer distro.</text>
  </g>

  <!-- terminal -->
  <g transform="translate(640 112)" filter="url(#shadow)">
    <rect width="552" height="372" rx="16" fill="#16161e" stroke="#2a2e45" stroke-width="1.5"/>
    <path d="M0 16 a16 16 0 0 1 16 -16 h520 a16 16 0 0 1 16 16 v28 h-552 z" fill="#1f2133"/>
    <circle cx="26" cy="22" r="6.5" fill="#f7768e"/>
    <circle cx="48" cy="22" r="6.5" fill="#e0af68"/>
    <circle cx="70" cy="22" r="6.5" fill="#9ece6a"/>
    <text x="276" y="27" class="mono" font-size="13" fill="#565f89" text-anchor="middle">~ devup init</text>

    <g class="mono" font-size="17">
      <text x="28" y="88"><tspan fill="#9ece6a">❯</tspan><tspan fill="#c0caf5" dx="10">devup init</tspan></text>
      <text x="28" y="126"><tspan fill="#7aa2f7">●</tspan><tspan fill="#a9b1d6" dx="10">distro</tspan><tspan fill="#c0caf5" dx="10">pacman · hyprland</tspan></text>
      <text x="28" y="156"><tspan fill="#bb9af7">◆</tspan><tspan fill="#a9b1d6" dx="10">perfis</tspan><tspan fill="#c0caf5" dx="10">dev + gaming</tspan></text>
      <text x="28" y="186"><tspan fill="#7dcfff">◆</tspan><tspan fill="#a9b1d6" dx="10">shell </tspan><tspan fill="#c0caf5" dx="10">zsh</tspan><tspan fill="#a9b1d6" dx="28">tema</tspan><tspan fill="#c0caf5" dx="10">tokyo-night</tspan></text>
      <text x="28" y="224"><tspan fill="#565f89">→ pacman -S git neovim docker lazygit…</tspan></text>
      <text x="28" y="254"><tspan fill="#565f89">→ flatpak install steam heroic…</tspan></text>
      <text x="28" y="284"><tspan fill="#565f89">→ link ~/.zshrc  ~/.config/kitty …</tspan></text>
      <text x="28" y="324"><tspan fill="#9ece6a">✓</tspan><tspan fill="#c0caf5" dx="10">19 módulos aplicados</tspan><tspan fill="#565f89" dx="12">em 1 comando</tspan></text>
      <rect class="cursor" x="28" y="340" width="10" height="20" rx="1" fill="#c0caf5"/>
    </g>
  </g>

  <!-- distros -->
  <g class="mono" font-size="15" text-anchor="middle">
    <g transform="translate(88 548)">
      <rect width="96" height="36" rx="18" fill="#1f2133" stroke="#2a2e45"/><text x="48" y="23" fill="#7aa2f7">arch</text>
      <rect x="108" width="96" height="36" rx="18" fill="#1f2133" stroke="#2a2e45"/><text x="156" y="23" fill="#f7768e">debian</text>
      <rect x="216" width="96" height="36" rx="18" fill="#1f2133" stroke="#2a2e45"/><text x="264" y="23" fill="#ff9e64">ubuntu</text>
      <rect x="324" width="96" height="36" rx="18" fill="#1f2133" stroke="#2a2e45"/><text x="372" y="23" fill="#7dcfff">fedora</text>
      <rect x="432" width="108" height="36" rx="18" fill="#1f2133" stroke="#2a2e45"/><text x="486" y="23" fill="#9ece6a">opensuse</text>
      <rect x="552" width="96" height="36" rx="18" fill="#1f2133" stroke="#2a2e45"/><text x="600" y="23" fill="#73daca">alpine</text>
      <rect x="660" width="84" height="36" rx="18" fill="#1f2133" stroke="#2a2e45"/><text x="702" y="23" fill="#bb9af7">void</text>
    </g>
    <text x="1192" y="572" text-anchor="end" fill="#565f89" font-size="14">+ derivadas · flatpak · AUR</text>
  </g>
</svg>
