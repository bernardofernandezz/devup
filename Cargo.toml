[package]
name = "devup"
version = "0.4.0"
edition = "2024"
description = "Seu Linux inteiro em um comando: apps, dotfiles, shell, tema e desktop, em qualquer distro"
repository = "https://github.com/bernardofernandezz/devup"
readme = "README.md"
keywords = ["linux", "dotfiles", "setup", "cli", "provisioning"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
console = "0.16.6"
ctrlc = "3.5.2"
dialoguer = "0.12.0"
flate2 = "1.1.10"
include_dir = "0.7.4"
indicatif = "0.18.6"
libc = "0.2.191"
lzma-rs = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
toml = "1.1.8"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "gzip", "json"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
