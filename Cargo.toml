[package]
name = "devup"
version = "0.3.0"
edition = "2024"
description = "Seu Linux inteiro em um comando: apps, dotfiles, shell, tema e desktop, em qualquer distro"
repository = "https://github.com/bernardofernandezz/devup"
readme = "README.md"
keywords = ["linux", "dotfiles", "setup", "cli", "provisioning"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
console = "0.16.6"
ctrlc = "3.5.2"
dialoguer = "0.12.0"
include_dir = "0.7.4"
indicatif = "0.18.6"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
