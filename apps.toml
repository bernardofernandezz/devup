# Catálogo do devup. Ordem de instalação: nativo (pacman/apt/dnf/zypper) → flatpak → script.
# Vários pacotes nativos podem ser separados por espaço. `bin`: se já estiver no PATH, o app é pulado.

# ---------- dev ----------
[[app]]
name = "git"
category = "dev"
description = "Controle de versão"
pacman = "git"
apt = "git"
dnf = "git"
zypper = "git"
bin = "git"

[[app]]
name = "neovim"
category = "dev"
description = "Editor de texto no terminal"
pacman = "neovim"
apt = "neovim"
dnf = "neovim"
zypper = "neovim"
flatpak = "io.neovim.nvim"

[[app]]
name = "docker"
category = "dev"
description = "Containers"
pacman = "docker docker-compose"
apt = "docker.io docker-compose"
dnf = "moby-engine docker-compose"
zypper = "docker docker-compose"

[[app]]
name = "lazygit"
category = "dev"
description = "TUI para git"
pacman = "lazygit"
apt = "lazygit"
zypper = "lazygit"

[[app]]
name = "cli-tools"
category = "dev"
description = "ripgrep, fzf, fd, bat, zoxide"
pacman = "ripgrep fzf fd bat zoxide"
apt = "ripgrep fzf fd-find bat zoxide"
dnf = "ripgrep fzf fd-find bat zoxide"
zypper = "ripgrep fzf fd bat zoxide"

[[app]]
name = "btop"
category = "dev"
description = "Monitor de recursos"
pacman = "btop"
apt = "btop"
dnf = "btop"
zypper = "btop"

[[app]]
name = "nodejs"
category = "dev"
description = "Node.js + npm"
pacman = "nodejs npm"
apt = "nodejs npm"
dnf = "nodejs npm"

[[app]]
name = "mise"
category = "dev"
description = "Gerenciador de versões (node, python, go...)"
pacman = "mise"
script = "curl -fsSL https://mise.run | sh"
bin = "mise"

[[app]]
name = "rustup"
category = "dev"
description = "Toolchain Rust"
pacman = "rustup"
script = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
bin = "rustup"

[[app]]
name = "vscode"
category = "dev"
description = "Visual Studio Code"
flatpak = "com.visualstudio.code"

[[app]]
name = "ghostty"
category = "dev"
description = "Terminal com GPU"
pacman = "ghostty"
zypper = "ghostty"

