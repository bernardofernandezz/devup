# Catálogo do devup. Ordem de instalação: nativo (pacman/apt/dnf/zypper/apk/xbps) → aur (paru/yay) → flatpak → script.
# Vários pacotes nativos podem ser separados por espaço. `bin`: se já estiver no PATH, a instalação é pulada.
# Depois da instalação: `services` (systemctl enable --now), `groups` (usermod -aG) e `run` (sh -c, idempotente).
# `files`: links para ~ (src relativo a catalog/assets/); o que existir no destino vai para backup.
# Módulos com o mesmo nome em ~/.config/devup/modules/*.toml sobrescrevem estes.

# ---------- perfis ----------
[profile.dev]
description = "Ferramentas de desenvolvimento"
modules = ["git", "neovim", "docker", "lazygit", "cli-tools", "btop", "mise", "tmux", "starship", "vscode"]

[profile.gaming]
description = "Jogos no Linux"
modules = ["steam", "lutris", "heroic", "protonup-qt", "gamemode", "mangohud", "discord"]

[profile.essentials]
description = "Apps do dia a dia"
modules = ["firefox", "obsidian", "spotify", "vlc", "libreoffice"]

[profile.server]
description = "Servidor headless"
modules = ["git", "neovim", "cli-tools", "btop", "docker"]

[profile.desktop]
description = "Fontes + config do seu desktop (GNOME, KDE, Hyprland ou Niri, o que estiver rodando)"
modules = ["fonts", "gnome", "kde", "hyprland", "niri"]

[profile.full]
description = "Dev + jogos + apps do dia a dia"
include = ["dev", "gaming", "essentials"]

# ---------- dev ----------
[[module]]
name = "git"
category = "dev"
description = "Controle de versão"
pacman = "git"
apt = "git"
dnf = "git"
zypper = "git"
apk = "git"
xbps = "git"
bin = "git"

[[module]]
name = "neovim"
category = "dev"
description = "Editor de texto no terminal"
pacman = "neovim"
apt = "neovim"
dnf = "neovim"
zypper = "neovim"
apk = "neovim"
xbps = "neovim"
flatpak = "io.neovim.nvim"

[[module]]
name = "docker"
category = "dev"
description = "Containers"
pacman = "docker docker-compose"
apt = "docker.io docker-compose"
dnf = "moby-engine docker-compose"
zypper = "docker docker-compose"
apk = "docker docker-cli-compose"
xbps = "docker docker-compose"
services = ["docker"]
groups = ["docker"]

[[module]]
name = "lazygit"
category = "dev"
description = "TUI para git"
requires = ["git"]
pacman = "lazygit"
apt = "lazygit"
zypper = "lazygit"
apk = "lazygit"
xbps = "lazygit"

[[module]]
name = "cli-tools"
category = "dev"
description = "ripgrep, fzf, fd, bat, zoxide"
pacman = "ripgrep fzf fd bat zoxide"
apt = "ripgrep fzf fd-find bat zoxide"
dnf = "ripgrep fzf fd-find bat zoxide"
zypper = "ripgrep fzf fd bat zoxide"
apk = "ripgrep fzf fd bat zoxide"
xbps = "ripgrep fzf fd bat zoxide"

[[module]]
name = "btop"
category = "dev"
description = "Monitor de recursos"
pacman = "btop"
apt = "btop"
dnf = "btop"
zypper = "btop"
apk = "btop"
xbps = "btop"

[[module]]
name = "nodejs"
category = "dev"
description = "Node.js + npm"
bin = "node"
pacman = "nodejs npm"
apt = "nodejs npm"
dnf = "nodejs nodejs-npm"
apk = "nodejs npm"
xbps = "nodejs"

[[module]]
name = "python"
category = "dev"
description = "Python 3 + pip"
pacman = "python python-pip"
apt = "python3 python3-pip"
dnf = "python3 python3-pip"
zypper = "python3 python3-pip"
apk = "python3 py3-pip"
xbps = "python3 python3-pip"

[[module]]
name = "go"
category = "dev"
description = "Linguagem Go"
pacman = "go"
apt = "golang"
dnf = "golang"
zypper = "go"
apk = "go"
xbps = "go"
bin = "go"

[[module]]
name = "mise"
category = "dev"
description = "Gerenciador de versões (node, python, go...)"
pacman = "mise"
script = "curl -fsSL https://mise.run | sh"
bin = "mise"

[[module]]
name = "rustup"
category = "dev"
description = "Toolchain Rust"
skip_if = "command -v cargo >/dev/null && ! command -v rustup >/dev/null"  # Rust já instalado de outro jeito; rustup conflitaria
pacman = "rustup"
script = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
bin = "rustup"

[[module]]
name = "vscode"
category = "dev"
description = "Visual Studio Code"
aur = "visual-studio-code-bin"
flatpak = "com.visualstudio.code"

[[module]]
name = "ghostty"
category = "dev"
description = "Terminal com GPU"
pacman = "ghostty"
zypper = "ghostty"
files = [{ src = "ghostty/config", dest = "~/.config/ghostty/config" }]

[[module]]
name = "kitty"
category = "dev"
description = "Terminal com GPU (usado no Hyprland e no Niri)"
pacman = "kitty"
apt = "kitty"
dnf = "kitty"
zypper = "kitty"
apk = "kitty"
xbps = "kitty"
files = [{ src = "kitty/kitty.conf", dest = "~/.config/kitty/kitty.conf" }]

[[module]]
name = "tmux"
category = "dev"
description = "Multiplexador de terminal (prefixo Ctrl-Space)"
pacman = "tmux"
apt = "tmux"
dnf = "tmux"
zypper = "tmux"
apk = "tmux"
xbps = "tmux"
files = [{ src = "tmux/tmux.conf", dest = "~/.config/tmux/tmux.conf" }]

[[module]]
name = "starship"
category = "shell"
description = "Prompt rápido para qualquer shell"
pacman = "starship"
zypper = "starship"
apk = "starship"
xbps = "starship"
script = "mkdir -p ~/.local/bin && curl -fsSL https://starship.rs/install.sh | sh -s -- -y -b ~/.local/bin"
bin = "starship"
files = [{ src = "starship/starship.toml", dest = "~/.config/starship.toml" }]

# Shells: escolha um com `devup shell <nome>` (ou `shell = "..."` no devup.toml).
[[module]]
name = "shell-common"
category = "shell"
description = "Aliases comuns a zsh, bash e fish"
requires = ["cli-tools", "starship"]
files = [{ src = "shell/aliases.sh", dest = "~/.config/devup/shell/aliases.sh" }]

[[module]]
name = "zsh"
category = "shell"
description = "Zsh com autosuggestions, syntax highlighting, starship e zoxide"
requires = ["shell-common"]
pacman = "zsh zsh-autosuggestions zsh-syntax-highlighting"
apt = "zsh zsh-autosuggestions zsh-syntax-highlighting"
dnf = "zsh zsh-autosuggestions zsh-syntax-highlighting"
zypper = "zsh"
apk = "zsh zsh-autosuggestions zsh-syntax-highlighting"
xbps = "zsh zsh-autosuggestions zsh-syntax-highlighting"
files = [{ src = "zsh/.zshrc", dest = "~/.zshrc" }]
run = ['s="$(command -v zsh)"; [ "$(getent passwd "$(id -un)" | cut -d: -f7)" = "$s" ] || chsh -s "$s"']

[[module]]
name = "fish"
category = "shell"
description = "Fish com starship e zoxide"
requires = ["shell-common"]
pacman = "fish"
apt = "fish"
dnf = "fish"
zypper = "fish"
apk = "fish"
xbps = "fish-shell"
files = [{ src = "fish/config.fish", dest = "~/.config/fish/config.fish" }]
run = ['s="$(command -v fish)"; [ "$(getent passwd "$(id -un)" | cut -d: -f7)" = "$s" ] || chsh -s "$s"']

[[module]]
name = "bash"
category = "shell"
description = "Bash com completion, starship e zoxide"
requires = ["shell-common"]
pacman = "bash bash-completion"
apt = "bash bash-completion"
dnf = "bash bash-completion"
zypper = "bash bash-completion"
apk = "bash bash-completion"
xbps = "bash bash-completion"
files = [{ src = "bash/.bashrc", dest = "~/.bashrc" }]
run = ['s="$(command -v bash)"; [ "$(getent passwd "$(id -un)" | cut -d: -f7)" = "$s" ] || chsh -s "$s"']

# ---------- desktop ----------
# `desktop = [...]`: o módulo só se aplica se esse for o desktop em uso (XDG_CURRENT_DESKTOP).
[[module]]
name = "fonts"
category = "desktop"
description = "JetBrainsMono Nerd Font + emoji"
pacman = "ttf-jetbrains-mono-nerd noto-fonts-emoji"
script = "d=~/.local/share/fonts/JetBrainsMonoNerd && mkdir -p $d && curl -fsSL https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.tar.xz | tar -xJ -C $d && fc-cache -f"

[[module]]
name = "gnome"
category = "desktop"
description = "GNOME: tema escuro, 6 workspaces, Super+1..6, Super+Q, Super+Enter"
desktop = ["gnome"]
requires = ["fonts"]
files = [{ src = "desktop/gnome.sh", dest = "~/.config/devup/desktop/gnome.sh" }]
run = ["sh ~/.config/devup/desktop/gnome.sh"]

[[module]]
name = "kde"
category = "desktop"
description = "KDE Plasma: tema escuro, 6 áreas de trabalho, Meta+1..6, Meta+Q"
desktop = ["kde"]
requires = ["fonts"]
files = [{ src = "desktop/kde.sh", dest = "~/.config/devup/desktop/kde.sh" }]
run = ["sh ~/.config/devup/desktop/kde.sh"]

[[module]]
name = "hyprland"
category = "desktop"
description = "Hyprland com waybar, fuzzel, mako, hyprlock e hypridle"
desktop = ["hyprland"]
skip_if = "[ -d /usr/share/omarchy ] || [ -d ~/.local/share/omarchy ]"  # outra ferramenta já gerencia o Hyprland nesta máquina
requires = ["fonts", "kitty"]
pacman = "hyprland hypridle hyprlock waybar fuzzel mako swaybg grim slurp wl-clipboard brightnessctl pavucontrol"
dnf = "hyprland waybar fuzzel mako swaybg grim slurp wl-clipboard brightnessctl pavucontrol"
zypper = "hyprland hypridle hyprlock waybar fuzzel mako swaybg grim slurp wl-clipboard brightnessctl pavucontrol"
files = [
  { src = "hypr/hyprland.conf", dest = "~/.config/hypr/hyprland.conf" },
  { src = "hypr/hypridle.conf", dest = "~/.config/hypr/hypridle.conf" },
  { src = "hypr/hyprlock.conf", dest = "~/.config/hypr/hyprlock.conf" },
  { src = "waybar/hyprland.jsonc", dest = "~/.config/waybar/config.jsonc" },
  { src = "waybar/style.css", dest = "~/.config/waybar/style.css" },
]
run = ["touch ~/.config/hypr/local.conf", "hyprctl reload >/dev/null 2>&1 || true"]

[[module]]
name = "niri"
category = "desktop"
description = "Niri com waybar, fuzzel, mako e swaylock"
desktop = ["niri"]
requires = ["fonts", "kitty"]
pacman = "niri waybar fuzzel mako swaybg swaylock swayidle wl-clipboard brightnessctl pavucontrol xwayland-satellite"
dnf = "niri waybar fuzzel mako swaybg swaylock swayidle wl-clipboard brightnessctl pavucontrol"
zypper = "niri waybar fuzzel mako swaybg swaylock swayidle wl-clipboard brightnessctl pavucontrol"
files = [
  { src = "niri/config.kdl", dest = "~/.config/niri/config.kdl" },
  { src = "waybar/niri.jsonc", dest = "~/.config/waybar/config.jsonc" },
  { src = "waybar/style.css", dest = "~/.config/waybar/style.css" },
]

