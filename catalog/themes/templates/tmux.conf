# devup: tema {{name}}
set -g status-style "bg={{background}},fg={{foreground}}"
set -g status-left "#[bold,fg={{accent}}] #S "
set -g window-status-current-style "fg={{accent}},bold"
set -g pane-border-style "fg={{surface}}"
set -g pane-active-border-style "fg={{accent}}"
set -g message-style "bg={{surface}},fg={{foreground}}"
