# Ao dar push numa tag v*: testa, gera binários estáticos (musl) e publica o Release
# com checksums e as notas da versão tiradas do CHANGELOG.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.arch }}-unknown-linux-musl
      - run: cargo test
      - run: cargo build --release --target ${{ matrix.arch }}-unknown-linux-musl
      - run: cp target/${{ matrix.arch }}-unknown-linux-musl/release/devup devup-${{ matrix.arch }}-linux
      - uses: actions/upload-artifact@v4
        with:
          name: devup-${{ matrix.arch }}-linux
          path: devup-${{ matrix.arch }}-linux

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum devup-* > sha256sums.txt && cat sha256sums.txt
      - name: Notas da versão
        # Pega a seção "## [x.y.z]" do CHANGELOG.md correspondente à tag.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { found = index($0, "[" v "]") > 0; next } /^\[/ { found = 0 } found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md não tem a seção [$version]"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          name: devup ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
